<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Snake Game</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(ellipse at center, #0f0f0f 0%, #000000 100%);
            font-family: 'Orbitron', monospace;
            color: #00ffff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            text-align: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #00ffff;
            border-radius: 15px;
            box-shadow: 
                0 0 20px #00ffff,
                inset 0 0 20px rgba(0, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 20px;
            text-shadow: 
                0 0 10px #00ffff,
                0 0 20px #00ffff,
                0 0 40px #00ffff;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 40px #00ffff; }
            to { text-shadow: 0 0 20px #00ffff, 0 0 30px #00ffff, 0 0 60px #00ffff; }
        }

        .score-container {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .score {
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00;
        }

        .high-score {
            color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff;
        }

        #gameCanvas {
            border: 3px solid #00ffff;
            border-radius: 10px;
            background: #000011;
            box-shadow: 
                0 0 30px #00ffff,
                inset 0 0 30px rgba(0, 255, 255, 0.1);
            margin-bottom: 20px;
        }

        .controls-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 20px;
        }

        .wasd-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .wasd-label {
            font-size: 0.9rem;
            margin-bottom: 5px;
            color: #ffff00;
            text-shadow: 0 0 5px #ffff00;
        }

        #wasdInput {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #ffff00;
            border-radius: 5px;
            color: #ffff00;
            font-family: 'Orbitron', monospace;
            font-size: 1rem;
            padding: 8px;
            text-align: center;
            width: 100px;
            box-shadow: 0 0 10px #ffff00;
            outline: none;
        }

        #wasdInput:focus {
            box-shadow: 0 0 20px #ffff00;
        }

        .arrow-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 5px;
            width: 120px;
            height: 120px;
        }

        .arrow-btn {
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid #00ffff;
            border-radius: 8px;
            color: #00ffff;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            user-select: none;
        }

        .arrow-btn:hover {
            background: rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 15px #00ffff;
            transform: scale(1.05);
        }

        .arrow-btn:active {
            background: rgba(0, 255, 255, 0.5);
            transform: scale(0.95);
        }

        .arrow-btn.up { grid-column: 2; grid-row: 1; }
        .arrow-btn.left { grid-column: 1; grid-row: 2; }
        .arrow-btn.down { grid-column: 2; grid-row: 3; }
        .arrow-btn.right { grid-column: 3; grid-row: 2; }

        .game-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .game-btn {
            background: rgba(255, 0, 255, 0.1);
            border: 2px solid #ff00ff;
            border-radius: 8px;
            color: #ff00ff;
            font-family: 'Orbitron', monospace;
            font-size: 1rem;
            font-weight: 700;
            padding: 12px 24px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .game-btn:hover {
            background: rgba(255, 0, 255, 0.3);
            box-shadow: 0 0 15px #ff00ff;
            transform: translateY(-2px);
        }

        .game-btn:active {
            transform: translateY(0);
        }

        .game-btn.pause {
            border-color: #ffff00;
            color: #ffff00;
            background: rgba(255, 255, 0, 0.1);
        }

        .game-btn.pause:hover {
            background: rgba(255, 255, 0, 0.3);
            box-shadow: 0 0 15px #ffff00;
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border: 3px solid #ff0000;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 30px #ff0000;
            display: none;
        }

        .game-over h2 {
            color: #ff0000;
            font-size: 2rem;
            margin-bottom: 15px;
            text-shadow: 0 0 10px #ff0000;
        }

        .game-over p {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .game-container {
                padding: 15px;
                width: 95vw;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .controls-container {
                flex-direction: column;
                gap: 15px;
            }
            
            .arrow-buttons {
                width: 100px;
                height: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>NEON SNAKE</h1>
        
        <div class="score-container">
            <div class="score">Score: <span id="currentScore">0</span></div>
            <div class="high-score">High Score: <span id="highScore">0</span></div>
        </div>
        
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        
        <div class="controls-container">
            <div class="wasd-container">
                <div class="wasd-label">WASD Controls</div>
                <input type="text" id="wasdInput" placeholder="Click & Type" maxlength="1">
            </div>
            
            <div class="arrow-buttons">
                <button class="arrow-btn up" data-direction="up">↑</button>
                <button class="arrow-btn left" data-direction="left">←</button>
                <button class="arrow-btn down" data-direction="down">↓</button>
                <button class="arrow-btn right" data-direction="right">→</button>
            </div>
        </div>
        
        <div class="game-buttons">
            <button class="game-btn pause" id="pauseBtn">Pause</button>
            <button class="game-btn" id="resetBtn">Reset</button>
        </div>
        
        <div class="game-over" id="gameOver">
            <h2>GAME OVER</h2>
            <p>Final Score: <span id="finalScore">0</span></p>
            <button class="game-btn" id="playAgainBtn">Play Again</button>
        </div>
    </div>

    <script src="snake.js"></script>
</body>
</html>
